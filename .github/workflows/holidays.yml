name: Daily Holidays Kstovo Bot

on:
  schedule:
    # Время указывается в UTC. 04:30 UTC = 07:30 по Москве
    - cron: '30 4 * * *'
  
  # Позволяет запускать скрипт вручную кнопкой "Run workflow" в интерфейсе GitHub
  workflow_dispatch:

jobs:
  send_morning_holidays:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run holidays script
        env:
          # Токен подтягивается из секретов репозитория
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python main.py
